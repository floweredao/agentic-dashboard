name: CI

on: pull_request

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      # The UI tests drive Bun.WebView, which uses Chrome on Linux. The runner's full Chrome
      # reports a viewport shorter than requested (733px for 820px), so use the headless shell.
      - run: bunx playwright install --with-deps chromium-headless-shell
      - run: echo "BUN_CHROME_PATH=$(find ~/.cache/ms-playwright -name chrome-headless-shell -type f | head -1)" >> "$GITHUB_ENV"
      - run: bun test
